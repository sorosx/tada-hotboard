name: 手动生成热榜报告

on:
  workflow_dispatch:
    inputs:
      edition:
        description: "报告版次"
        required: true
        type: choice
        options:
          - 午间
          - 晚间
      day:
        description: "报告日期（北京时间 YYYY-MM-DD；留空为今天）"
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: board-report
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: 生成报告
        env:
          EDITION: ${{ inputs.edition }}
          DAY: ${{ inputs.day }}
        run: |
          if [ -n "$DAY" ]; then
            python3 scripts/build.py --edition "$EDITION" --day "$DAY"
          else
            python3 scripts/build.py --edition "$EDITION"
          fi

      - name: 提交报告
        shell: bash
        run: |
          git config user.name "hotboard-bot"
          git config user.email "hotboard-bot@users.noreply.github.com"
          git add reports/
          if git diff --cached --quiet; then
            echo "报告无变化"
            exit 0
          fi
          git commit -m "手动补生成报告：${{ inputs.edition }}"
          for i in 1 2 3; do
            if git pull --rebase origin main && git push origin HEAD:main; then
              exit 0
            fi
            sleep 5
          done
          echo "报告推送失败"
          exit 1
