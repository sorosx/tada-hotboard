name: 值守采集（每次连续工作约6小时，结束前自动接力）

# 值守任务每小时采集；定时触发作为接力链中断时的兜底。
on:
  schedule:
    - cron: "11 0,3,6,9,12,15,18,21 * * *"
  workflow_dispatch: {}

permissions:
  contents: write
  actions: write

concurrency:
  group: keeper
  cancel-in-progress: false

jobs:
  keep:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: 每小时采集并在午间、晚间生成报告
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          start=$(date +%s)
          end=$(( start + 340*60 ))
          relayed=0
          failures=0
          while :; do
            if ! bash scripts/cycle.sh; then
              failures=$((failures + 1))
              echo "本轮采集或报告/推送失败，继续下一轮；累计失败：$failures"
            fi

            now=$(date +%s)
            # 在下一个北京时间整点采集，报告窗口可纳入 12:00/19:00 边界快照。
            next=$(( (now/3600 + 1)*3600 ))
            if [ "$next" -ge "$end" ]; then
              gh workflow run keeper.yml --ref "${GITHUB_REF_NAME}" && relayed=1 || echo "接力启动失败，等定时任务兜底"
              break
            fi
            sleep $(( next - now ))
          done
          echo "本段结束，接力：$relayed；失败轮次：$failures"
          if [ "$failures" -gt 0 ]; then exit 1; fi
