name: 值守采集（每次连续工作约6小时）

# GitHub 的定时触发经常被跳过。这个工作流一旦启动，就在同一台机器上
# 每小时采集一次，连续约 5 小时 50 分钟；多个时间点触发，接力覆盖全天。
# 同一北京时间小时只存一份，所以和“每小时采集热榜”重叠也不会重复。
on:
  schedule:
    - cron: "11 0,3,6,9,12,15,18,21 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: keeper
  cancel-in-progress: false

jobs:
  keep:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
      - name: 每小时采集，循环约 5 小时 50 分钟
        run: |
          end=$(( $(date +%s) + 350*60 ))
          while :; do
            bash scripts/cycle.sh || true
            # 睡到下一个整点后 3 分钟
            now=$(date +%s)
            next=$(( (now/3600 + 1)*3600 + 180 ))
            [ $next -ge $end ] && break
            sleep $(( next - now ))
          done
