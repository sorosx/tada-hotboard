name: 每小时采集热榜

on:
  schedule:
    # GitHub 的 cron 用协调世界时（UTC），北京时间比它快 8 小时，整点对整点不受影响。
    # GitHub 繁忙时常跳过定时任务，所以这里只作补位；主力是“值守采集”工作流。
    - cron: "7,37 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: 采集一次（同一北京时间小时只存一份）
        run: bash scripts/cycle.sh
