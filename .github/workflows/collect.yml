name: 每小时采集热榜

on:
  schedule:
    # 每小时第 7 分钟运行（避开整点高峰）；GitHub 的定时任务可能延迟几分钟到几十分钟
    - cron: "7 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: 采集一次快照
        run: python3 scripts/collect.py

      - name: 更新当天和前一天的汇总
        if: always()
        run: python3 scripts/rollup.py

      - name: 提交数据
        if: always()
        run: |
          git config user.name "hotboard-bot"
          git config user.email "hotboard-bot@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "没有新数据"; exit 0
          fi
          git commit -m "快照 $(TZ=Asia/Shanghai date '+%Y-%m-%d %H:%M')"
          for i in 1 2 3; do
            git pull --rebase --quiet && git push && exit 0
            sleep 5
          done
          exit 1
